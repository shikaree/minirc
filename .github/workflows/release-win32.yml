name: Win32 release

# Every push to main rebuilds MinIRC.exe and overwrites the rolling
# "latest" release, so the download URL never changes:
# https://github.com/shikaree/minirc/releases/latest/download/MinIRC.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'MinIRC.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-win32
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build
        shell: msys2 {0}
        # OS=Windows_NT picks the Win32 branch of the Makefile (msys2's shell
        # doesn't export it). -static avoids a runtime dependency on the
        # toolchain's libgcc/libwinpthread DLLs.
        run: make OS=Windows_NT LDFLAGS=-static

      - name: Collect release info
        id: info
        shell: bash
        run: |
          version=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' headers.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Without this the `latest` tag stays on the commit it was first created
      # at, so the release page's "Source code" links would go stale.
      - name: Move the `latest` tag to this commit
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MinIRC ${{ steps.info.outputs.version }} (${{ steps.info.outputs.sha }})
          body: |
            Automatic Win32 build of [`${{ steps.info.outputs.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            Console IRC client, no install needed — download `MinIRC.exe` and run it.
          make_latest: true
          files: MinIRC.exe
